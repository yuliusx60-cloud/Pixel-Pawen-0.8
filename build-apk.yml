name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange files
        run: |
          mkdir -p www assets
          if [ -f index.html ]; then mv index.html www/; fi
          if [ -f splash.png ]; then mv splash.png www/; fi
          for f in icon-only.png icon-background.png icon-foreground.png; do
            if [ -f "$f" ]; then mv "$f" assets/; fi
          done

      - name: Install dependencies
        run: npm install

      - name: Make native splash image
        continue-on-error: true
        run: |
          node -e "const s=require('sharp');s({create:{width:2732,height:2732,channels:3,background:'#0a0d23'}}).composite([{input:'www/splash.png',gravity:'centre'}]).png().toFile('assets/splash.png').then(()=>require('fs').copyFileSync('assets/splash.png','assets/splash-dark.png'))"

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icons from assets/
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0a0d23' --splashBackgroundColor '#0a0d23'

      - name: Lock portrait orientation
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Pawns-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
